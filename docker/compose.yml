name: pptmaster

services:
  pptmaster-postgres:
    image: postgres:17.6-bookworm
    container_name: pptmaster-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pptmaster}
      POSTGRES_USER: ${POSTGRES_USER:-pptmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [pptmaster-network]

  pptmaster-redis:
    image: redis:7-alpine
    container_name: pptmaster-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [pptmaster-network]

  pptmaster-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: pptmaster-web:local
    container_name: pptmaster-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pptmaster}:${POSTGRES_PASSWORD}@pptmaster-postgres:5432/${POSTGRES_DB:-pptmaster}
      REDIS_URL: redis://pptmaster-redis:6379/0
      WORKSPACE_ROOT: /srv/projects
      DEFAULT_MODEL: ${PPTMASTER_DEFAULT_MODEL:-}
      ALLOWED_MODELS: ${PPTMASTER_ALLOWED_MODELS:-}
      AIHUB_API_KEY: ${AIHUB_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PPTMASTER_CONFIG_ENCRYPTION_KEY: ${PPTMASTER_CONFIG_ENCRYPTION_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./data/projects:/srv/projects
    depends_on:
      pptmaster-postgres:
        condition: service_healthy
      pptmaster-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [pptmaster-network]

  pptmaster-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    image: pptmaster-runner:local
    container_name: pptmaster-runner
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pptmaster}:${POSTGRES_PASSWORD}@pptmaster-postgres:5432/${POSTGRES_DB:-pptmaster}
      REDIS_URL: redis://pptmaster-redis:6379/0
      WORKSPACE_ROOT: /srv/projects
      HOST_PROJECTS_ROOT: ${PPTMASTER_HOST_PROJECTS_ROOT:?Run docker/bin/compose.sh or set PPTMASTER_HOST_PROJECTS_ROOT}
      WORKER_IMAGE: pptmaster-worker:local
      WORKER_NETWORK: pptmaster-network
      WORKER_UID: ${PPTMASTER_WORKER_UID:-10003}
      WORKER_GID: ${PPTMASTER_WORKER_GID:-10003}
      PPTMASTER_WEB_UID: ${PPTMASTER_WEB_UID:-10001}
      DEFAULT_MODEL: ${PPTMASTER_DEFAULT_MODEL:-}
      ALLOWED_MODELS: ${PPTMASTER_ALLOWED_MODELS:-}
      HOST_OPENCODE_CONFIG_ROOT: ${PPTMASTER_HOST_OPENCODE_CONFIG_ROOT:?Run docker/bin/compose.sh or set PPTMASTER_HOST_OPENCODE_CONFIG_ROOT}
      PPTMASTER_OPENCODE_ENV_ALLOWLIST: ${PPTMASTER_OPENCODE_ENV_ALLOWLIST:-}
      OPENCODE_IDLE_TIMEOUT_SECONDS: ${PPTMASTER_OPENCODE_IDLE_TIMEOUT_SECONDS:-600}
      AIHUB_API_KEY: ${AIHUB_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PPTMASTER_CONFIG_ENCRYPTION_KEY: ${PPTMASTER_CONFIG_ENCRYPTION_KEY:-}
    volumes:
      - ${PPTMASTER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./data/projects:/srv/projects
    depends_on:
      pptmaster-postgres:
        condition: service_healthy
      pptmaster-redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [pptmaster-network]

  # The image is also started by the runner for each queued job.
  # Compose builds it once so the runner always has its required local image.
  pptmaster-worker-image:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        APT_MIRROR: ${PPTMASTER_APT_MIRROR:-https://mirrors.aliyun.com/debian}
        PIP_INDEX_URL: ${PPTMASTER_PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    image: pptmaster-worker:local
    profiles: [build]
    networks: [pptmaster-network]

  pptmaster-caddy:
    image: caddy:2.8.4-alpine
    container_name: pptmaster-caddy
    environment:
      PPTMASTER_SITE_ADDRESS: ${PPTMASTER_SITE_ADDRESS:-:80}
    ports:
      - ${PPTMASTER_HTTP_PORT:-8080}:80
      - ${PPTMASTER_HTTPS_PORT:-8443}:443
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      pptmaster-api:
        condition: service_healthy
    restart: unless-stopped
    networks: [pptmaster-network]

networks:
  pptmaster-network:
    name: pptmaster-network
    driver: bridge
